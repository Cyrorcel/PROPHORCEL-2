name: Build Prophorcel

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev

      - name: Configurer
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configurer (macOS, binaire universel)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Récupérer le VST3
        shell: bash
        run: |
          mkdir -p dist
          VST=$(find build -type d -name Prophorcel.vst3 | head -n 1)
          echo "Plugin trouvé : $VST"
          cp -R "$VST" dist/
          ls -R dist | head -20

      - name: Signature locale (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/Prophorcel.vst3/Contents/MacOS/Prophorcel
          codesign --force --deep -s - dist/Prophorcel.vst3
          file dist/Prophorcel.vst3/Contents/MacOS/Prophorcel

      - name: Publier le VST3
        uses: actions/upload-artifact@v4
        with:
          name: Prophorcel-VST3-${{ matrix.name }}
          path: dist
